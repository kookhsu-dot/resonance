
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>共鸣 Resonance</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#eee7e9,#faf6ef);color:#322d38;font-family:-apple-system,"PingFang SC",sans-serif}
main{max-width:680px;margin:auto;padding:42px 20px}
h1{font-family:Georgia,serif;font-size:35px}
.sub,.muted{color:#817886}
.panel,.result{background:#ffffffbd;border-radius:22px;padding:20px;margin:15px 0;box-shadow:0 8px 30px #6d52640d}
textarea{width:100%;min-height:130px;border:0;background:transparent;font-size:17px;line-height:1.7;outline:none}
button{border:0;border-radius:14px;padding:13px 18px;font-size:15px}
.primary{width:100%;background:#89718f;color:white}
.tabs{display:flex;gap:8px;margin:20px 0}
.tabs button{flex:1;background:#fff9}
.tabs .active{background:#89718f;color:white}
.quote{font:19px/1.8 Georgia,"Songti SC",serif}
.meta{font-size:13px;color:#817886;margin-top:12px}
a{color:#796383}
.secondary{background:#eee7ed;margin-top:12px}
</style>
</head>
<body>
<main>
<div style="font-size:30px">✦</div>
<h1>共鸣 <small>Resonance</small></h1>
<p class="sub">你所想到的，也曾有人在世界的某个角落想过。</p>
<div class="panel">
<b>今天，你想到了什么？</b>
<textarea id="thought" placeholder="写下一句话，或者一个突然出现的念头……"></textarea>
<button class="primary" onclick="search()">✦ 寻找思想的共鸣</button>
</div>
<div class="tabs">
<button onclick="show('results')" id="tresults" class="active">共鸣发现</button>
<button onclick="show('saved')" id="tsaved">我的收藏</button>
<button onclick="show('history')" id="thistory">灵感日记</button>
</div>
<div id="content" class="muted">写下一个念头，开始寻找共鸣。</div>
<p class="muted" style="font-size:12px;line-height:1.7;margin-top:35px">当前为离线经典文学演示版，采用主题关键词扩展匹配，并非全球书籍全文搜索。收藏保存在当前浏览器中。</p>
</main>
<script>
const books=[
{q:"知我者谓我心忧，不知我者谓我何求。",a:"佚名",b:"《诗经·黍离》",k:"孤独 理解 知己 误解 心事 悲伤",u:"https://zh.wikisource.org/wiki/詩經/黍離"},
{q:"人生天地之间，若白驹之过隙，忽然而已。",a:"庄子",b:"《庄子·知北游》",k:"时间 生命 短暂 岁月 无常",u:"https://zh.wikisource.org/wiki/莊子/知北遊"},
{q:"相濡以沫，不如相忘于江湖。",a:"庄子",b:"《庄子·大宗师》",k:"爱情 离别 放手 自由 关系 失去",u:"https://zh.wikisource.org/wiki/莊子/大宗師"},
{q:"海内存知己，天涯若比邻。",a:"王勃",b:"《送杜少府之任蜀州》",k:"朋友 友谊 距离 陪伴 思念",u:"https://zh.wikisource.org/wiki/送杜少府之任蜀州"},
{q:"此情可待成追忆，只是当时已惘然。",a:"李商隐",b:"《锦瑟》",k:"怀念 回忆 遗憾 过去 爱情 失去",u:"https://zh.wikisource.org/wiki/錦瑟"},
{q:"行到水穷处，坐看云起时。",a:"王维",b:"《终南别业》",k:"平静 人生 困境 自由 自然 希望",u:"https://zh.wikisource.org/wiki/終南別業"},
{q:"不以物喜，不以己悲。",a:"范仲淹",b:"《岳阳楼记》",k:"情绪 自我 平静 得失 成败",u:"https://zh.wikisource.org/wiki/岳陽樓記"},
{q:"人有悲欢离合，月有阴晴圆缺，此事古难全。",a:"苏轼",b:"《水调歌头》",k:"离别 思念 家庭 团圆 遗憾",u:"https://zh.wikisource.org/wiki/水調歌頭_(明月幾時有)"},
{q:"To be, or not to be, that is the question.",a:"William Shakespeare",b:"Hamlet",k:"存在 人生 生死 选择 痛苦",u:"https://www.gutenberg.org/ebooks/1524"},
{q:"I am no bird; and no net ensnares me: I am a free human being with an independent will.",a:"Charlotte Brontë",b:"Jane Eyre",k:"自由 独立 自我 女性 尊严",u:"https://www.gutenberg.org/ebooks/1260"},
{q:"All happy families are alike; each unhappy family is unhappy in its own way.",a:"Leo Tolstoy",b:"Anna Karenina",k:"家庭 婚姻 幸福 痛苦 关系",u:"https://www.gutenberg.org/ebooks/1399"}
];
let results=[];
const get=k=>JSON.parse(localStorage.getItem(k)||"[]");
const put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function search(){
let q=document.getElementById("thought").value.trim();
if(!q){alert("请先输入灵感");return}
let terms=q;
const expand={怀念:"回忆 思念 过去 遗憾",孤独:"知己 理解 误解",失去:"离别 放手 回忆",爱:"爱情 陪伴 关系",时间:"岁月 生命 短暂",自由:"独立 选择",工作:"成败 情绪 自我",孩子:"家庭 生命 陪伴"};
for(let k in expand)if(q.includes(k))terms+=" "+expand[k];
results=books.map((b,i)=>({i,s:b.k.split(" ").filter(w=>terms.includes(w)).length*3+[...new Set(q)].filter(c=>b.q.includes(c)).length*.2})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8).map(x=>x.i);
let h=get("history");h.unshift({q,date:new Date().toLocaleString()});put("history",h.slice(0,100));
show("results")
}
function card(i){
let b=books[i],saved=get("saved").includes(i);
return `<div class="result"><div class="quote">“${b.q}”</div><div class="meta">${b.a} · ${b.b}</div><div class="meta"><a href="${b.u}" target="_blank" rel="noopener">核对作品来源 ↗</a></div><button class="secondary" onclick="save(${i})">${saved?"♥ 已收藏":"♡ 收藏"}</button></div>`
}
function save(i){
let a=get("saved");put("saved",a.includes(i)?a.filter(x=>x!==i):[...a,i]);show(current)
}
let current="results";
function show(tab){
current=tab;
for(let t of ["results","saved","history"])document.getElementById("t"+t).classList.toggle("active",t===tab);
let el=document.getElementById("content");
if(tab==="results")el.innerHTML=results.length?results.map(card).join(""):"暂无匹配，请换一种表达试试。";
if(tab==="saved")el.innerHTML=get("saved").length?get("saved").map(card).join(""):"还没有收藏。";
if(tab==="history")el.innerHTML=get("history").map(x=>`<div class="result"><small>${x.date}</small><p></p></div>`).join("")||"还没有灵感记录。";
if(tab==="history")get("history").forEach((x,i)=>el.children[i].querySelector("p").textContent=x.q);
}
</script>
</body>
</html>
